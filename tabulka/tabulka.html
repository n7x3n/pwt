<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulka</title>
    <link rel="shortcut icon" href="../images/Ikona.png" type="image/x-icon">
    <link rel="stylesheet" href="tabulka.css">
</head>

<body>
    <h3>Tabulka</h3>
    <hr>
    <table> <!-- Tabulka-->
        <caption>rozvrh hodin</caption> <!--nadpis tabulky-->
        <thead> <!--záhlaví tabulky-->
            <tr><!--řádek tabulky-->
                <th rowspan="2" scope="rowgroup">1. C<sub>2</sub></th> <!--text tabulky-->
                <!-- rowspan -> přes kolik řádků je buňka-->
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
            </tr>
            <tr>
                <th>8:00 - 8:45</th>
                <th>8:50 - 9:35</th>
                <th>9:55 - 10:40</th>
                <th>10:45 - 11:30</th>
                <th>12:00 - 12:45</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pondělí</td>
                <td>MAT</td>
                <td>MAT</td>
                <td>DGD</td>
                <td>PWT</td>
                <td>ANJ</td>
            </tr>
            <tr>
                <td>Úterý</td>
                <td>MAT</td>
                <td>MAT</td>
                <td>DGD</td>
                <td>PWT</td>
                <td>ANJ</td>
            </tr>
            <tr>
                <td>Středa</td>
                <td>MAT</td>
                <td>MAT</td>
                <td>DGD</td>
                <td>PWT</td>
                <td>ANJ</td>
            </tr>
            <tr>
                <td>Čtvrtek</td>
                <td>MAT</td>
                <td>MAT</td>
                <td>DGD</td>
                <td>PWT</td>
                <td>ANJ</td>
            </tr>
            <tr>
                <td>Pátek</td>
                <td>MAT</td>
                <td>MAT</td>
                <td>DGD</td>
                <td>PWT</td>
                <td>ANJ</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="6">Mgr. Hana Doležalová</td> <!--colspan -> přes kolik sloupců je buňka-->
            </tr>
        </tfoot>
    </table>
</body>

</html>
