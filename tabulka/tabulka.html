<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <title>Tabulka</title>
    <link rel="shortcut icon" href="../images/Ikona.png" type="image/x-icon">
</head>
<body>
    <h3>Tabulka</h3>
    <table> <!-- Tabulka-->
        <caption>rozvrh hodin</caption> <!--nadpis tabulky-->

            <tr><!--řádek tabulky-->
                <th><!--text tabulky-->
                    1. C<sub>2</sub>
                </th>
            </tr>
        </thead>
    </table>
</body>
</html>
