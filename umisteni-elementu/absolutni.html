<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <title>Absolutní umístění</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .obal {
            position: relative;
            width: auto;
            height: auto;
            border: 2px solid burlywood;
        }

        .blok1 {
            position: relative;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: red;
            padding: 10px;
            font-size: 20px;
        }

        .blok2 {
            position: absolute;
            left: 224px;
            top: 0px;
            /*Počítá od nejbližšího nadřazeného elementu, který má absolutní nebo relativní pozici*/
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: green;
            padding: 10px;
            font-size: 20px;
        }

        .blok3 {
            position: relative;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: blue;
            color: white;
            padding: 10px;
            font-size: 20px;
        }

        .blok4 {
            position: absolute;
            top: 224px;
            left: 224px;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: grey;
            color: white;
            padding: 10px;
            font-size: 20px;
        }

        .blok5 {
            position: absolute;
            top: 112px;
            left: 112px;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: pink;
            color: white;
            padding: 10px;
            font-size: 20px;
            opacity: 75%;
        }
    </style>
</head>

<body>
    <div class="obal">
        <div class="blok1">
            AAA
        </div>
        <div class="blok2">
            BBB
        </div>
        <div class="blok3">
            CCC
        </div>
        <div class="blok4">
            DDD
        </div>
        <div class="blok5">
            EEE
        </div>
    </div>
</body>

</html>
