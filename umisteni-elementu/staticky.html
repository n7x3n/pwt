<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <title>Statické umístění</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .blok1 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: red;
            padding: 10px;
            font-size: 20px;
        }
        .blok2 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: green;
            padding: 10px;
            font-size: 20px;
        }
        .blok3 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: blue;
            color: white;
            padding: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <!--
        Statické umístění
    elementy jsou zobrazeny na webovce tak, jak jsou napsány v html souboru
    každý element má své místo
    -->
    <div class="blok1">
        AAA
    </div>
    <div class="blok2">
        BBB
    </div>
    <div class="blok3">
        CCC
    </div>
</body>

</html>
